name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GStreamer MSVC
        shell: pwsh
        run: |
          $v = "1.26.11"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$v/msvc"
          Invoke-WebRequest "$base/gstreamer-1.0-msvc-x86_64-$v.msi" -OutFile "$env:TEMP\gst-runtime.msi"
          Invoke-WebRequest "$base/gstreamer-1.0-devel-msvc-x86_64-$v.msi" -OutFile "$env:TEMP\gst-devel.msi"
          $r = Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\gst-runtime.msi`" /qn ADDLOCAL=ALL /norestart" -Wait -PassThru
          "runtime exit: $($r.ExitCode)"
          $d = Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\gst-devel.msi`" /qn ADDLOCAL=ALL /norestart" -Wait -PassThru
          "devel exit: $($d.ExitCode)"
          if ($r.ExitCode -ne 0 -or $d.ExitCode -ne 0) { exit 1 }
          $pc = Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)', 'C:\gstreamer' -Recurse -Filter glib-2.0.pc -ErrorAction SilentlyContinue -Depth 6 | Select-Object -First 1
          "glib pc at: $($pc.FullName)"
          if (-not $pc) { Get-ChildItem 'C:\' -Directory | Select-Object -ExpandProperty Name; exit 1 }
          $root = (Resolve-Path (Join-Path $pc.DirectoryName '..\..')).Path
          "gstreamer root: $root"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$($pc.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          choco install pkgconfiglite -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Stage artifacts
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/melissm.exe "Melissm-${{ github.ref_name }}-x64-portable.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Melissm-*-x64-portable.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
